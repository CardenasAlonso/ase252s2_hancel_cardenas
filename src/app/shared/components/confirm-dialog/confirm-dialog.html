@if (open) {
  <div class="dialog-backdrop" (click)="onCancel()" role="presentation">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" (click)="$event.stopPropagation()">
      <h3 id="dialog-title">{{ title }}</h3>
      <p>{{ message }}</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" (click)="onCancel()">{{ cancelText }}</button>
        <button type="button" class="btn" [class.btn-danger]="danger" (click)="onConfirm()">{{ confirmText }}</button>
      </div>
    </div>
  </div>
}
